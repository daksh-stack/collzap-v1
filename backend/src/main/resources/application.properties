# Local-dev-only secrets (Cloudinary/Resend keys) live in application-secrets.properties,
# which is gitignored and never bundled into the jar/Docker image. In production those same
# properties come from real environment variables via docker-compose's .env instead, so this
# import is silently skipped there.
spring.config.import=optional:file:./application-secrets.properties

spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/collzap_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
collzap.jwt.secret=${JWT_SECRET}
collzap.jwt.issuer=collzap
collzap.jwt.access-token-ttl=2h
collzap.jwt.refresh-token-ttl=30d
server.port=8081
server.forward-headers-strategy=framework
collzap.mail.log-codes=${LOG_OTP_CODES:true}
collzap.seriousness-test.retake-lock-days=${RETAKE_LOCK_DAYS:0}
collzap.admin.bootstrap-username=${ADMIN_BOOTSTRAP_USERNAME:admin}
collzap.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}
collzap.admin.seed-demo-data=${SEED_DEMO_DATA:true}
collzap.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
collzap.cloudinary.api-key=${CLOUDINARY_API_KEY:}
collzap.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
collzap.mail.resend-api-key=${RESEND_API_KEY:}
collzap.mail.from-address=${MAIL_FROM_ADDRESS:otp@mail.collzap.com}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=1800000
